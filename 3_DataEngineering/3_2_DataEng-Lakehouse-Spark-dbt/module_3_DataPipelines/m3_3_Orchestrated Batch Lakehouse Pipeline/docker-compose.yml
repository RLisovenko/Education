
# Module 3.3 — Building an Orchestrated Batch Lakehouse Pipeline
# Reconstructed from the instructor's screenshots
# Local training environment — not production-ready

services:
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-bookworm
    container_name: lakehouse-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lakehouse-minio
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"  
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  spark:
    image: apache/spark:3.5.7
    container_name: lakehouse-spark
    depends_on:
      - minio
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data:/opt/project/data
      - ./spark:/opt/project/spark
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  airflow-init:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: "course2-lakehouse-demo-jwt-secret-2026"
      AIRFLOW__API__SECRET_KEY: "course2-lakehouse-demo-api-secret-2026"

    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/project/data
      - ./spark:/opt/project/spark
      - /var/run/docker.sock:/var/run/docker.sock

    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

  airflow-apiserver:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-apiserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment: *airflow-env
    volumes: *airflow-volumes

    ports:
      - "127.0.0.1:8083:8080"

    command: api-server

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  airflow-scheduler:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler

  airflow-worker:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

    environment: *airflow-env
    volumes: *airflow-volumes
    command: celery worker

  airflow-triggerer:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

    environment: *airflow-env
    volumes: *airflow-volumes
    command: triggerer

  airflow-dag-processor:
    image: apache/airflow:3.3.1
    container_name: lakehouse-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

    environment: *airflow-env
    volumes: *airflow-volumes
    command: dag-processor

volumes:
  minio-data:
